[project]
name = "excel_view"
authors = [
    { name = "Ujjwal Aggrawal", email = "ujjmee2279@gmail.com"}
]
description = "Adding Excel View as default view"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.

    # ── V2 IntelliFlow / GenBI ─────────────────────────────────────────────────
    "networkx>=3.0",          # Schema graph traversal + join path discovery
    "mlxtend>=0.23",          # Association rule mining for Pattern Mining
    "scikit-learn>=1.3",      # TF-IDF similarity for GenBI column matching
    "scipy>=1.11",            # Numerical routines (scikit dependency)
    "numpy>=1.24",            # Array ops (scikit / pandas dependency)
    "pandas>=2.0",            # Data frame ops for analysis pipeline
    "RapidFuzz>=3.0",         # Fuzzy column name matching (Smart Lookup Layer 2)
    "spacy>=3.7",             # NER for PROMPT() formula (V3.5 roadmap)
    # Note: spaCy model (en_core_web_sm) is in requirements.txt as direct URL
    "sentence-transformers>=2.2",  # Semantic embeddings for GenBI join suggestions
    "pdfplumber>=0.10",       # PDF export parsing (V2.5+)

    # ── V3 IntelliFlow — no new Python packages ────────────────────────────────
    # V3 is entirely client-side JS. New endpoints (bulk_fetch_for_duckdb,
    # get_doctype_schema) use core Frappe ORM only — no extra Python deps.
    # New JS packages (dagre, sql-formatter, comlink) are in package.json.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
